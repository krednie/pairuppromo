<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" width="100%" height="100%" fill="none">
  <defs>
    <!-- Pattern of bone dots for the garment -->
    <pattern id="garment-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#F7F7FB" />
    </pattern>
  </defs>
  
  <g id="builder-silhouette">
    <!-- Legs & Shoes (Ink #070912) -->
    <path d="M 185 580 L 175 730 L 160 730 L 170 580 Z" fill="#070912" />
    <path d="M 225 580 L 235 730 L 250 730 L 235 580 Z" fill="#070912" />
    
    <!-- Long outer coat / garment (Ink #070912) -->
    <path d="M 170 230 C 180 210, 240 210, 250 230 C 265 290, 275 420, 280 580 C 250 590, 170 590, 140 580 C 145 420, 155 290, 170 230 Z" fill="#070912" />
    
    <!-- Pattern layer overlay for coat -->
    <path d="M 170 230 C 180 210, 240 210, 250 230 C 265 290, 275 420, 280 580 C 250 590, 170 590, 140 580 C 145 420, 155 290, 170 230 Z" fill="url(#garment-dots)" opacity="0.85" />
    
    <!-- Head (Ink #070912) -->
    <circle cx="210" cy="160" r="32" fill="#070912" />
    
    <!-- Hair moving slightly to one side (Ink #070912) -->
    <path d="M 175 160 C 180 120, 240 120, 245 160 C 255 175, 260 190, 265 200 C 245 198, 230 185, 210 185 C 190 185, 180 198, 160 200 C 165 190, 170 175, 175 160 Z" fill="#070912" />
    <path d="M 245 160 C 255 170, 265 175, 275 180 C 260 185, 250 182, 242 175 Z" fill="#070912" />
  </g>
</svg>
