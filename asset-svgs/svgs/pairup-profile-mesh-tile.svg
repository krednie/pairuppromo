<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <!-- Layered fine bone paths (#F7F7FB) with 1px stroke weight -->
  <g stroke="#F7F7FB" stroke-width="1" opacity="0.6">
    <!-- Concentric diamond matrix -->
    <!-- Cell Centers at: 
         Row 1: y=40  (x=40, 120, 200, 280)
         Row 2: y=120 (x=40, 120, 200, 280)
         Row 3: y=200 (x=40, 120, 200, 280)
         Row 4: y=280 (x=40, 120, 200, 280)
    -->
    
    <!-- Outer Diamonds -->
    <path d="M 40 0 L 80 40 L 40 80 L 0 40 Z M 120 0 L 160 40 L 120 80 L 80 40 Z M 200 0 L 240 40 L 200 80 L 160 40 Z M 280 0 L 320 40 L 280 80 L 240 40 Z" />
    <path d="M 40 80 L 80 120 L 40 160 L 0 120 Z M 120 80 L 160 120 L 120 160 L 80 120 Z M 200 80 L 240 120 L 200 160 L 160 120 Z M 280 80 L 320 120 L 280 160 L 240 120 Z" />
    <path d="M 40 160 L 80 200 L 40 240 L 0 200 Z M 120 160 L 160 200 L 120 240 L 80 200 Z M 200 160 L 240 200 L 200 240 L 160 200 Z M 280 160 L 320 200 L 280 240 L 240 200 Z" />
    <path d="M 40 240 L 80 280 L 40 320 L 0 280 Z M 120 240 L 160 280 L 120 320 L 80 280 Z M 200 240 L 240 280 L 200 320 L 160 280 Z M 280 240 L 320 280 L 280 320 L 240 280 Z" />
    
    <!-- Middle Diamonds (Layered inset) -->
    <path d="M 40 15 L 65 40 L 40 65 L 15 40 Z M 120 15 L 145 40 L 120 65 L 95 40 Z M 200 15 L 225 40 L 200 65 L 175 40 Z M 280 15 L 305 40 L 280 65 L 255 40 Z" />
    <path d="M 40 95 L 65 120 L 40 145 L 15 120 Z M 120 95 L 145 120 L 120 145 L 95 120 Z M 200 95 L 225 120 L 200 145 L 175 120 Z M 280 95 L 305 120 L 280 145 L 255 120 Z" />
    <path d="M 40 175 L 65 200 L 40 225 L 15 200 Z M 120 175 L 145 200 L 120 225 L 95 200 Z M 200 175 L 225 200 L 200 225 L 175 200 Z M 280 175 L 305 200 L 280 225 L 255 200 Z" />
    <path d="M 40 255 L 65 280 L 40 305 L 15 280 Z M 120 255 L 145 280 L 120 305 L 95 280 Z M 200 255 L 225 280 L 200 305 L 175 280 Z M 280 255 L 305 280 L 280 305 L 255 280 Z" />

    <!-- Inner Diamonds (Layered inset) -->
    <path d="M 40 28 L 52 40 L 40 52 L 28 40 Z M 120 28 L 132 40 L 120 52 L 108 40 Z M 200 28 L 212 40 L 200 52 L 188 40 Z M 280 28 L 292 40 L 280 52 L 268 40 Z" />
    <path d="M 40 108 L 52 120 L 40 132 L 28 120 Z M 120 108 L 132 120 L 120 132 L 108 120 Z M 200 108 L 212 120 L 200 132 L 188 120 Z M 280 108 L 292 120 L 280 132 L 268 120 Z" />
    <path d="M 40 188 L 52 200 L 40 212 L 28 200 Z M 120 188 L 132 200 L 120 212 L 108 200 Z M 200 188 L 212 200 L 200 212 L 188 200 Z M 280 188 L 292 200 L 280 212 L 268 200 Z" />
    <path d="M 40 268 L 52 280 L 40 292 L 28 280 Z M 120 268 L 132 280 L 120 292 L 108 280 Z M 200 268 L 212 280 L 200 292 L 188 280 Z M 280 268 L 292 280 L 280 292 L 268 280 Z" />

    <!-- Intersecting Mesh Lines (connecting centers of diamonds diagonally) -->
    <line x1="0" y1="0" x2="320" y2="320" />
    <line x1="320" y1="0" x2="0" y2="320" />
    
    <line x1="80" y1="0" x2="320" y2="240" />
    <line x1="160" y1="0" x2="320" y2="160" />
    <line x1="240" y1="0" x2="320" y2="80" />
    <line x1="0" y1="80" x2="240" y2="320" />
    <line x1="0" y1="160" x2="160" y2="320" />
    <line x1="0" y1="240" x2="80" y2="320" />

    <line x1="240" y1="0" x2="0" y2="240" />
    <line x1="160" y1="0" x2="0" y2="160" />
    <line x1="80" y1="0" x2="0" y2="80" />
    <line x1="320" y1="80" x2="80" y2="320" />
    <line x1="320" y1="160" x2="160" y2="320" />
    <line x1="320" y1="240" x2="240" y2="320" />
  </g>
  
  <!-- One Electric Violet Accent Dot (#7B61FF, centrally located) -->
  <circle cx="160" cy="160" r="3" fill="#7B61FF" />
</svg>
