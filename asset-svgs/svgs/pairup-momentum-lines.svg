<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="100%" height="100%" fill="none">
  <!-- 12-18 fine flowing curves (Bone #F7F7FB and Cyan #5DE4FF) -->
  <g opacity="0.65">
    <!-- Curve 1 -->
    <path d="M 200 600 C 400 580, 800 400, 1400 100" stroke="#5DE4FF" stroke-width="2.5" />
    <!-- Curve 2 -->
    <path d="M 220 620 C 450 590, 900 380, 1400 80" stroke="#F7F7FB" stroke-width="1.8" />
    <!-- Curve 3 -->
    <path d="M 180 580 C 350 560, 750 420, 1400 120" stroke="#7B61FF" stroke-width="1.2" />
    <!-- Curve 4 -->
    <path d="M 240 640 C 500 600, 950 360, 1400 60" stroke="#5DE4FF" stroke-width="2.0" />
    <!-- Curve 5 -->
    <path d="M 260 660 C 550 610, 1000 340, 1400 40" stroke="#F7F7FB" stroke-width="1.0" />
    <!-- Curve 6 -->
    <path d="M 150 550 C 300 540, 700 440, 1400 140" stroke="#7B61FF" stroke-width="1.5" />
    
    <!-- Higher momentum lines -->
    <!-- Curve 7 -->
    <path d="M 210 595 C 420 520, 850 320, 1400 150" stroke="#5DE4FF" stroke-width="2.2" />
    <!-- Curve 8 -->
    <path d="M 230 615 C 470 535, 900 300, 1400 130" stroke="#F7F7FB" stroke-width="1.2" />
    <!-- Curve 9 -->
    <path d="M 190 575 C 370 505, 800 340, 1400 170" stroke="#7B61FF" stroke-width="1.0" />
    
    <!-- Wider sweeping lines -->
    <!-- Curve 10 -->
    <path d="M 250 635 C 520 540, 950 250, 1400 20" stroke="#5DE4FF" stroke-width="2.5" />
    <!-- Curve 11 -->
    <path d="M 270 655 C 570 550, 1000 220, 1400 5" stroke="#F7F7FB" stroke-width="1.6" stroke-dasharray="3,3" />
    <!-- Curve 12 -->
    <path d="M 290 670 C 620 560, 1050 180, 1400 -10" stroke="#5DE4FF" stroke-width="1.0" />
    <!-- Curve 13 -->
    <path d="M 170 560 C 320 480, 750 300, 1300 -20" stroke="#7B61FF" stroke-width="1.5" />
  </g>
</svg>
