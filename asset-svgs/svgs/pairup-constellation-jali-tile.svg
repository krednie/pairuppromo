<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 192" width="328" height="192" fill="none">
  <!-- Bone-colored fine paths (#F7F7FB) with 1px stroke weight -->
  <g stroke="#F7F7FB" stroke-width="1" opacity="0.65">
    <!-- Diamond Grid Matrix -->
    <path d="M 41 0 L 82 48 L 41 96 L 0 48 Z" />
    <path d="M 123 0 L 164 48 L 123 96 L 82 48 Z" />
    <path d="M 205 0 L 246 48 L 205 96 L 164 48 Z" />
    <path d="M 287 0 L 328 48 L 287 96 L 246 48 Z" />
    
    <path d="M 41 96 L 82 144 L 41 192 L 0 144 Z" />
    <path d="M 123 96 L 164 144 L 123 192 L 82 144 Z" />
    <path d="M 205 96 L 246 144 L 205 192 L 164 144 Z" />
    <path d="M 287 96 L 328 144 L 287 192 L 246 144 Z" />
    
    <!-- Outer Intersections (Octagonal framing) -->
    <path d="M 0 0 L 41 48 L 0 96" />
    <path d="M 328 0 L 287 48 L 328 96" />
    <path d="M 0 96 L 41 144 L 0 192" />
    <path d="M 328 96 L 287 144 L 328 192" />
    
    <!-- Concentric Inner Geometry (Octagonal flowers) -->
    <circle cx="41" cy="48" r="16" />
    <circle cx="123" cy="48" r="16" />
    <circle cx="205" cy="48" r="16" />
    <circle cx="287" cy="48" r="16" />
    
    <circle cx="41" cy="144" r="16" />
    <circle cx="123" cy="144" r="16" />
    <circle cx="205" cy="144" r="16" />
    <circle cx="287" cy="144" r="16" />
    
    <!-- Edge loops for circles cutting borders -->
    <path d="M 0 0 A 16 16 0 0 1 0 16" />
    <path d="M 328 0 A 16 16 0 0 0 328 16" />
    <path d="M 0 96 A 16 16 0 0 1 0 112" />
    <path d="M 328 96 A 16 16 0 0 0 328 112" />
    <path d="M 0 192 A 16 16 0 0 1 0 176" />
    <path d="M 328 192 A 16 16 0 0 0 328 176" />
  </g>
  
  <!-- Tiny bone dots at star vertices -->
  <g fill="#F7F7FB" opacity="0.8">
    <circle cx="41" cy="0" r="1.5" />
    <circle cx="123" cy="0" r="1.5" />
    <circle cx="205" cy="0" r="1.5" />
    <circle cx="287" cy="0" r="1.5" />
    
    <circle cx="0" cy="48" r="1.5" />
    <circle cx="82" cy="48" r="1.5" />
    <circle cx="164" cy="48" r="1.5" />
    <circle cx="246" cy="48" r="1.5" />
    <circle cx="328" cy="48" r="1.5" />
    
    <circle cx="41" cy="96" r="1.5" />
    <circle cx="123" cy="96" r="1.5" />
    <circle cx="205" cy="96" r="1.5" />
    <circle cx="287" cy="96" r="1.5" />
    
    <circle cx="0" cy="144" r="1.5" />
    <circle cx="82" cy="144" r="1.5" />
    <circle cx="164" cy="144" r="1.5" />
    <circle cx="246" cy="144" r="1.5" />
    <circle cx="328" cy="144" r="1.5" />
    
    <circle cx="41" cy="192" r="1.5" />
    <circle cx="123" cy="192" r="1.5" />
    <circle cx="205" cy="192" r="1.5" />
    <circle cx="287" cy="192" r="1.5" />
  </g>
  
  <!-- One Electric Cyan Accent Dot (#5DE4FF, placed centrally per tile) -->
  <circle cx="164" cy="96" r="3" fill="#5DE4FF" />
</svg>
